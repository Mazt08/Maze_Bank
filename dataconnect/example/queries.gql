mutation CreateUser {
  user_insert(data: {
    id_expr: "auth.uid",
    fullName: "John Doe",
    email: "john@example.com",
    createdAt_expr: "request.time"
  })
}

mutation UpdateUser($fullName: String, $phoneNumber: String, $address: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {
    fullName: $fullName,
    phoneNumber: $phoneNumber,
    address: $address
  })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(id: {id_expr: "auth.uid"}) {
    fullName
    email
    phoneNumber
    address
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing public user profiles.") {
  users {
    id
    fullName
  }
}

mutation CreateAccount($accountType: String!, $balance: Float!, $currency: String!, $nickname: String) @auth(level: USER) {
  account_insert(data: {
    accountType: $accountType,
    balance: $balance,
    currency: $currency,
    nickname: $nickname,
    ownerId_expr: "auth.uid"
  })
}

mutation UpdateAccount($id: UUID!, $nickname: String) @auth(level: USER) {
  account_update(id: $id, data: {nickname: $nickname})
}

mutation DeleteAccount($id: UUID!) @auth(level: USER) {
  account_delete(id: $id)
}

query GetAccount($id: UUID!) @auth(level: USER) {
  account(id: $id) {
    accountType
    balance
    currency
    nickname
  }
}

query ListMyAccounts @auth(level: USER) {
  accounts(where: {ownerId: {eq_expr: "auth.uid"}}) {
    id
    nickname
    balance
  }
}

mutation CreateTransaction($amount: Float!, $transactionType: String!, $status: String!, $accountId: UUID!, $description: String, $recipientAccountId: UUID) @auth(level: USER) {
  transaction_insert(data: {
    amount: $amount,
    transactionType: $transactionType,
    status: $status,
    accountId: $accountId,
    description: $description,
    recipientAccountId: $recipientAccountId,
    timestamp_expr: "request.time"
  })
}

mutation UpdateTransaction($id: UUID!, $status: String!) @auth(level: USER) {
  transaction_update(id: $id, data: {status: $status})
}

mutation DeleteTransaction($id: UUID!) @auth(level: USER) {
  transaction_delete(id: $id)
}

query GetTransaction($id: UUID!) @auth(level: USER) {
  transaction(id: $id) {
    amount
    status
    description
  }
}

query ListMyTransactions($accountId: UUID!) @auth(level: USER) {
  transactions(where: {accountId: {eq: $accountId}}) {
    id
    amount
    timestamp
  }
}

mutation CreateBeneficiary($nickname: String!, $recipientAccountNumber: String!) @auth(level: USER) {
  beneficiary_insert(data: {
    nickname: $nickname,
    recipientAccountNumber: $recipientAccountNumber,
    ownerId_expr: "auth.uid"
  })
}

mutation UpdateBeneficiary($id: UUID!, $nickname: String) @auth(level: USER) {
  beneficiary_update(id: $id, data: {nickname: $nickname})
}

mutation DeleteBeneficiary($id: UUID!) @auth(level: USER) {
  beneficiary_delete(id: $id)
}

query GetBeneficiary($id: UUID!) @auth(level: USER) {
  beneficiary(id: $id) {
    nickname
    recipientAccountNumber
  }
}

query ListMyBeneficiaries @auth(level: USER) {
  beneficiaries(where: {ownerId: {eq_expr: "auth.uid"}}) {
    id
    nickname
  }
}

mutation CreateNotification($message: String!, $linkUrl: String) @auth(level: USER) {
  notification_insert(data: {
    message: $message,
    isRead: false,
    linkUrl: $linkUrl,
    userId_expr: "auth.uid",
    createdAt_expr: "request.time"
  })
}

mutation MarkNotificationRead($id: UUID!) @auth(level: USER) {
  notification_update(id: $id, data: {isRead: true})
}

mutation DeleteNotification($id: UUID!) @auth(level: USER) {
  notification_delete(id: $id)
}

query GetNotification($id: UUID!) @auth(level: USER) {
  notification(id: $id) {
    message
    isRead
    createdAt
  }
}

query ListMyNotifications @auth(level: USER) {
  notifications(where: {userId: {eq_expr: "auth.uid"}}) {
    id
    message
    isRead
  }
}