<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Maze Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-header-brand">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">M</div>
                <span>MAZE BANK</span>
            </a>
            <div class="brand-subtitle">Commercial & Private Banking</div>
        </div>

        <div class="auth-card">
            <h1 class="auth-card-title">Open an Account</h1>
            <p class="auth-card-description">Create your online banking credentials in seconds.</p>

            <div id="alertBox" class="alert d-none"></div>

            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose a username" required autofocus minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required minlength="6">
                    <div class="form-helper">Minimum 6 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
