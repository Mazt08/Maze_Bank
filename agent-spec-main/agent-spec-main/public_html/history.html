<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Statements - Maze Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">
                    <div class="brand-icon">M</div>
                    <span>MAZE BANK</span>
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="dashboard.html" class="sidebar-nav-link">
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="transfer.html" class="sidebar-nav-link">
                        <span>Transfer Funds</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="history.html" class="sidebar-nav-link active">
                        <span>Statements</span>
                    </a>
                </li>
                <li class="sidebar-nav-item d-none" id="adminNav">
                    <a href="admin.html" class="sidebar-nav-link">
                        <span>Admin Console</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div>
                        <div class="sidebar-user-name" id="sidebarUserName">Loading...</div>
                        <div class="sidebar-user-role" id="sidebarUserRole">USER</div>
                    </div>
                    <button id="logoutBtn" class="btn-logout" title="Sign Out">Sign Out</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Account Statements</h1>
                    <div class="page-subtitle">View and search comprehensive ledger history.</div>
                </div>
                <span class="badge badge-user tabular-nums" id="txCount">0 records</span>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Filter Transactions</h2>
                </div>
                <div class="card-body">
                    <form id="searchForm" class="filter-bar">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search memo, account number...">
                        <button type="submit" class="btn btn-primary">Search</button>
                        <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body" style="padding: 0;">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Ref #</th>
                                    <th>Date & Time</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>Counterparty</th>
                                    <th style="text-align: right;">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="6" class="empty-state">Loading transactions...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/history.js"></script>
</body>
</html>
